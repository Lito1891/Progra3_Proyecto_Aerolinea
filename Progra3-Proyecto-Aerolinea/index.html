<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Apex Fly</h1>

    <img src="img/avion.jpg" alt="Logo de Apex Fly" width="600">

    <p>Tu próximo destino está a un solo clic. Viaja con comodidad y seguridad.</p>

    <div>   
        <a href="#buscador"><button>Buscar Vuelos</button></a>

        <a href="#destinos"><button>Ver Destinos</button></a>

    </div>
<!--sección de buscador de vuelos-->
<section id="buscador">
    <h2>Buscador de Vuelos</h2>
<form>
    <!--campo para el origen-->
    <label for="origen">Origen:</label>
    <input type="text" id="origen" name="origen" placeholder="Ciudad de origen">
    <br><br>
    <!--campo para el destino-->
    <label for="destino">Destino:</label>
    <input type="text" id="destino" name="destino" placeholder="Ciudad de destino">
    <br><br>
    <!--campo para la fecha de viaje-->
    <label for="fecha">Fecha de Viaje:</label>
    <input type="date" id="fecha" name="fecha">
    <br><br>
    <!--botón para enviar el formulario de búsqueda-->
    <button type="submit">Consultar Disponibilidad</button>
</form>
    

</section>
<hr> <!-- una linea divisoria-->

<!--sección de destinos-->
<section id="destinos">
    <h2>Nuestros Destinos Destacados</h2>
    <p>Explora los lugares increíbles a los que puedes volar con Apex Fly.</p>
    <ul>
        <li>París, Francia</li>
        <li>Tokio, Japón</li>
        <li>Río de Janeiro, Brasil</li>
        <li>Sídney, Australia</li>
</body>
</html>
